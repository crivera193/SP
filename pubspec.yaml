name: campus_app
description: UTRGV-GO campus exploration app.
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.12.1
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.12.4
  mapbox_maps_flutter: 2.26.0
  geolocator: ^14.1.2
  lottie: 3.6.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/auth/field-notes-map.png
    - assets/campus/
    - assets/icon/
    - assets/player/cowboy/
    - assets/animations/kitty-island/
    - assets/animations/plants/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/Vgo_icon.png"
  min_sdk_android: 21
